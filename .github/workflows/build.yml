name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test engine and AI
        shell: bash
        run: ./gradlew :engine:test :ai:test --stacktrace 2>&1 | tee test.log

      - name: Build APK
        shell: bash
        run: ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk pixel-rpg-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: |
            Пиксельные Хроники, сборка ${{ github.run_number }}.
            Скачай файл pixel-rpg-${{ github.run_number }}.apk на телефон и открой его, чтобы установить или обновить игру.
            Коммит: ${{ github.sha }}
          files: pixel-rpg-${{ github.run_number }}.apk
          make_latest: true

      # Итог сборки и ошибки компиляции — в ветку ci-logs, чтобы их можно было прочитать через git.
      - name: Save CI log
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q && git checkout -q -b ci-logs
          {
            echo "run: ${{ github.run_number }}"
            echo "sha: ${{ github.sha }}"
            echo "status: ${{ job.status }}"
          } > status.txt
          for f in test build; do
            src="$GITHUB_WORKSPACE/$f.log"
            [ -f "$src" ] || continue
            grep -E "^e: |^w: |What went wrong|FAILED|Exception" -A4 "$src" | head -n 400 > "$f-errors.txt" || true
            tail -n 300 "$src" > "$f-tail.txt"
          done
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "CI ${{ github.run_number }}: ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
